# Local public HapMap3 smoke-test config.
# Copy to config/config.yaml before running the example workflow.
project:
  analysis_name: "stage1_hapmap3_example"
  cohort_data_release: "hapmap3_example_fixture"
  genome_build: "auto"
  run_mode: "test"


# The local example does not require a prebuilt reference package.
reference_package:
  root: ""
  fingerprint: ""


analysis:
  ancestries:
    - HMAP_A
    - HMAP_B


inputs:
  sample_manifest: "config/hapmap3_sample_manifest.tsv"
  trait_registry: "config/hapmap3_traits.tsv"
  ancestry_mode: "computed"
  ancestry_file: "config/example_ancestry.tsv"
  pcs_file: "config/example_pcs.tsv"
  projected_pcs_file: "config/hapmap3_pcs.tsv"
  reference_pcs_file: "config/hapmap3_reference_pcs.tsv"


tools:
  plink2: "plink2"
  admixture: "admixture"


genotypes:
  type: "bed"
  prefix: "data/example/hapmap3"


genome_build:
  marker_file: "resources/build_markers.tsv"
  min_markers: 50
  min_match_fraction: 0.95
  min_marker_margin: 20
  min_fraction_margin: 0.20


popmad:
  pcs: 10
  reference_outlier_sd: 4.0
  min_confidence: 0.05
  min_reference_population_n: 20
  max_unassigned_fraction: 0.02


admixture:
  enabled: false
  mode: "supervised"
  k: 5
  labels:
    - AFR
    - AMR
    - EAS
    - EUR
    - SAS
  reference_genotypes:
    type: "pgen"
    prefix: "reference-data/1000g/1000g"
  metadata:
    path: "reference-data/1000g/1000g_sample_metadata.tsv"
    sample_id_column: "sample_id"
    fid_column: ""
    population_column: "population"
    super_population_column: "super_population"
  filters:
    maf_min: 0.01
    geno_missing_max: 0.02
    snps_only_acgt: true
    autosome_only: true
    max_alleles: 2
    remove_duplicate_ids: true
    exclude_palindromic: true
  min_pruned_variants: 50000
  exclusion_regions: ""
  ld_prune:
    window: 50
    step: 10
    r2: 0.1


ancestry_reference:
  enabled: false
  reference_genome_build: ""
  variant_set: ""
  reference_genotypes:
    type: "pgen"
    prefix: "reference-data/hgdp_1kg/hgdp_1kg"
  metadata:
    path: "reference-data/hgdp_1kg/hgdp_1kg_sample_metadata.tsv"
    sample_id_column: "s"
    fid_column: ""
    population_column: "population"
    super_population_column: "super_population"
  filters:
    maf_min: 0.01
    geno_missing_max: 0.02
    snps_only_acgt: true
    autosome_only: true
    max_alleles: 2
    remove_duplicate_ids: true
    exclude_palindromic: true
  warn_shared_variants_below: 50000
  min_shared_variants: 10000
  exclusion_regions: ""
  ld_prune:
    window: 1500
    step: 150
    r2: 0.1
  pca:
    approx: true
    min_projection_pc_correlation: 0.95


qc:
  info_min: 0.8
  maf_min: 0.01
  hwe_p_min: 1e-6
  geno_missing_max: 0.05
  sample_missing_max: 0.05
  use_mach_r2_filter: false
  snps_only_acgt: false
  autosome_only: true


relatedness:
  mode: "plink2_king"
  king_cutoff: 0.0884
  remove_sex_mismatches: false
  maf_min: 0.05
  geno_missing_max: 0.02
  sample_missing_max: 0.05
  snps_only_acgt: false
  autosome_only: true
  ld_prune:
    window: "500kb"
    step: 1
    r2: 0.2


sex_check:
  enabled: true
  action: "warn"
  allow_no_sex_markers: false
  max_female_xf: ""
  min_male_xf: ""
  max_female_yrate: ""
  min_male_yrate: ""


gwas:
  test: "ADD"
  default_covariates:
    - age
    - age2
    - sex
    - PC1
    - PC2
    - PC3
    - PC4
    - PC5
    - PC6
    - PC7
    - PC8
    - PC9
    - PC10
  extra_covariates: []
  covar_variance_standardize: true
  allow_missing_pcs: false
  glm_options: "hide-covar firth-fallback"


warnings:
  min_n: 500
  min_cases: 50
  min_controls: 50


resources:
  software_manifest: "resources/manifests/software.tsv"
  reference_manifest: "resources/manifests/reference_data.tsv"
  input_manifest: ""


runtime:
  threads_small: 2
  threads_gwas: 4
  threads_admixture: 2
  mem_mb_small: 4000
  mem_mb_gwas: 16000
  mem_mb_admixture: 16000
  time_min_small: 30
  time_min_gwas: 240
  time_min_admixture: 240
