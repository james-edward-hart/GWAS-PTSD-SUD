# Project identity; genome_build options: auto only.
project:
  analysis_name: "my_stage1_gwas"
  cohort_data_release: "cohort_freeze_or_release_label"
  genome_build: "auto"


# Prebuilt unpacked reference package; set only the root and content fingerprint.
# Package creation is intentionally outside this Snakemake workflow.
reference_package:
  root: "/path/to/stage1_reference_package"
  fingerprint: "sha256-from-content_fingerprint.sha256"


# Candidate GWAS ancestry strata. Strata with fewer than min_stratum_n assigned
# samples are reported and skipped before within-ancestry PCs or GWAS jobs are
# created. These labels must exist in POP-MaD super_population output. ADMIXTURE
# reference labels are configured separately under admixture.labels.
analysis:
  min_stratum_n: 50
  ancestries:
    - AFR
    - AMR
    - EAS
    - EUR
    - SAS


# User input tables. For production, keep protected cohort files on secure
# cluster-visible storage and point to them here. sample_manifest is the
# phenotype + covariate file. The workflow computes ancestry and PC covariates
# from the fingerprinted reference package; do not add separate ancestry-label
# or PC files.
inputs:
  sample_manifest: "/path/to/cohort/sample_manifest.tsv"
  trait_registry: "/path/to/cohort/trait_registry.tsv"


# Tool commands. Production must point PLINK2 to the approved alpha 7.1+ Linux
# binary; other defaults can come from the Snakemake conda environments.
tools:
  plink2: "plink2"
  plink1: "plink"
  admixture: "admixture"
  regenie: "regenie"
  remeta: "remeta"


# Study genotype dataset; type options: pgen, bed.
genotypes:
  type: "pgen"
  prefix: "/path/to/cohort/genotypes_without_extension"


# Genome-build inference thresholds; keep strict for production data.
genome_build:
  marker_file: "resources/build_markers.tsv"
  min_markers: 50
  min_match_fraction: 0.95
  min_marker_margin: 20
  min_fraction_margin: 0.20


# POP-MaD assignment settings; pcs options: 1-20, default 10.
# Fine-scale reference populations below min_reference_population_n are skipped;
# each configured ancestry must retain at least one population model.
popmad:
  pcs: 10
  reference_outlier_sd: 4.0
  min_confidence: 0.05
  min_reference_population_n: 20
  max_unassigned_fraction: 0.07


# Report-only supervised ADMIXTURE QC. Production requires enabled: true.
# Reference paths are resolved from the prebuilt reference_package.
admixture:
  enabled: true
  mode: "supervised"
  k: 5
  labels:
    - AFR
    - AMR
    - EAS
    - EUR
    - SAS
  # ADMIXTURE marker filters; boolean options: true, false.
  filters:
    maf_min: 0.01
    geno_missing_max: 0.02
    snps_only_acgt: true
    autosome_only: true
    max_alleles: 2
    remove_duplicate_ids: true
    exclude_palindromic: true
  min_pruned_variants: 50000
  exclusion_regions: ""

  # ADMIXTURE LD pruning; window is a variant count by default.
  ld_prune:
    window: 50
    step: 10
    r2: 0.1


# Production ancestry-reference projection. Production requires enabled: true.
# Reference paths are resolved from the prebuilt reference_package.
ancestry_reference:
  enabled: true
  reference_genome_build: ""
  variant_set: ""

  # Reference marker filters; boolean options: true, false.
  filters:
    maf_min: 0.01
    geno_missing_max: 0.02
    snps_only_acgt: true
    autosome_only: true
    max_alleles: 2
    remove_duplicate_ids: true
    exclude_palindromic: true
  warn_shared_variants_below: 50000
  min_shared_variants: 10000
  exclusion_regions: ""

  # Reference LD pruning; window examples: 500kb, 1000kb, or variant counts.
  ld_prune:
    window: 1500
    step: 150
    r2: 0.1

  # Reference PCA projection validation; approx options: true, false.
  pca:
    approx: true
    min_projection_pc_correlation: 0.95


# GWAS variant/sample QC filters; boolean options: true, false.
qc:
  info_min: 0.9
  maf_min: 0.01
  hwe_p_min: 1e-6
  geno_missing_max: 0.05
  sample_missing_max: 0.05
  # PLINK2 expects INFO/MaCH R2 annotations for this filter; set false if absent.
  use_mach_r2_filter: true
  snps_only_acgt: false
  autosome_only: true


# Relatedness filtering; mode options: plink2_king, all_samples.
relatedness:
  mode: "plink2_king"
  king_cutoff: 0.0884

  # Legacy compatibility; prefer sex_check.action: exclude for sex-mismatch removal.
  remove_sex_mismatches: false
  maf_min: 0.05
  geno_missing_max: 0.02
  sample_missing_max: 0.05
  snps_only_acgt: false
  autosome_only: true

  # Relatedness LD pruning; window examples: 500kb, 1000kb, or variant counts.
  ld_prune:
    window: "500kb"
    step: 1
    r2: 0.2


# Genetic sex check; action options: warn, fail, exclude.
sex_check:
  enabled: true
  action: "exclude"
  # Production fails without usable non-PAR X markers unless this override is true.
  allow_no_sex_markers: false
  # Sex-marker MAF/missingness reuse qc; LD pruning reuses relatedness.ld_prune.
  # PAR is split from the inferred build before non-PAR X/Y markers are pruned.
  # If all threshold fields are blank, the workflow uses chrX defaults:
  # max_female_xf: 0.2 and min_male_xf: 0.8. Custom settings must include
  # both chrX thresholds; Y-rate thresholds are optional but must be paired.
  max_female_xf: ""
  min_male_xf: ""
  max_female_yrate: ""
  min_male_yrate: ""


# PLINK2 GWAS settings; test options: ADD unless glm_options requests more tests.
gwas:
  test: "ADD"
  default_covariates:
    - age
    - age2
    - sex
    - PC1
    - PC2
    - PC3
    - PC4
    - PC5
    - PC6
    - PC7
    - PC8
    - PC9
    - PC10
  extra_covariates: []
  covar_variance_standardize: true
  allow_missing_pcs: false
  glm_options: "hide-covar firth-fallback"


# Phase 2 pooled pan-ancestry GWAS with regenie.
phase2_regenie:
  enabled: true
  global_pcs: 10
  # Empty or omitted means age, age2, sex, and PC1-PC{global_pcs}.
  default_covariates: []
  extra_covariates: []
  apply_rint: false
  # Blank htp_cohort_name uses filename-safe project.analysis_name.
  htp_cohort_name: ""
  min_mac: 1
  p_thresh: 0.01
  step1_bsize: 1000
  step2_bsize: 400
  step1_options: ""
  step2_options: ""

  # Association genotype QC applied by the existing PLINK2 PGEN build immediately
  # before regenie Step 2. Set maf_min to "" to disable this pooled MAF filter.
  step2:
    filters:
      maf_min: 0.01

  # Phase 2 PCA markers. Long-range LD/problem-region exclusions reuse the
  # resolved ancestry_reference.exclusion_regions file.
  global_pca:
    filters:
      maf_min: 0.01
      geno_missing_max: 0.02
      snps_only_acgt: true
      autosome_only: true
      max_alleles: 2
      remove_duplicate_ids: true
    ld_prune:
      window: "500kb"
      step: 1
      r2: 0.2

  # Regenie Step 1 model markers, independent from the PCA marker set.
  step1:
    filters:
      # regenie recommends MAC filtering before Step 1 to avoid low-variance
      # model SNP failures. These filters are applied after the group keep file,
      # then PLINK2 hardcall genotype counts are used to remove SNPs with no
      # hardcall variance or insufficient hardcall MAC for Step 1.
      # If source PVAR metadata has INFO/R2 annotations, variants below qc.info_min
      # are removed before hardcall conversion; missing INFO/R2 values are kept.
      mac_min: 100
      maf_min: 0.01
      geno_missing_max: 0.02
      snps_only_acgt: true
      autosome_only: true
      max_alleles: 2
      remove_duplicate_ids: true
    ld_prune:
      window: "1000kb"
      step: 1
      r2: 0.2


# Cohort-side evidence for central marginal ReMeta gene tests. This branch
# deliberately produces no local gene p-values: it exports sample-matched
# regenie HTP statistics and marginal, within-gene LD matrices.
remeta:
  enabled: false
  # Only wes or imputed are accepted. Basic genotyping-array data are excluded.
  data_source: ""
  # Required pairing: wes=hardcall, imputed=dosage.
  genotype_mode: ""
  # Enabling the branch requires an explicit true acknowledgment that input
  # variants were split, left-normalized, and reference-aligned for the inferred
  # genome build before entering this workflow.
  input_variants_normalized: false
  resource_root: "resources/remeta"
  min_mac: 1
  geno_missing_max: 0.05
  # Used only for imputed dosages; INFO/MaCH R2 annotations must be present.
  info_min: 0.8
  # ReMeta's published/default marginal target-LD sparsity threshold.
  target_r2: 0.0001


# Stage 1 report warnings; Phase 2 traits below these thresholds are skipped.
warnings:
  min_n: 300
  min_cases: 50
  min_controls: 50


# Manifests for reproducibility; input paths are recorded automatically from config.
resources:
  software_manifest: "resources/manifests/software.tsv"
  reference_manifest: "resources/manifests/reference_data.tsv"
  # Optional: leave blank unless your team wants extra cohort-release notes.
  input_manifest: ""


# Default local resources; HPC overrides can live in profiles/slurm/config.yaml.
runtime:
  threads_small: 2
  threads_gwas: 4
  threads_admixture: 4
  threads_phase2_pca: 4
  threads_regenie_step1: 4
  threads_regenie_step2: 4
  threads_remeta_ld: 4
  mem_mb_small: 32000
  mem_mb_gwas: 32000
  mem_mb_admixture: 32000
  mem_mb_phase2_pca: 32000
  mem_mb_regenie_step1: 32000
  mem_mb_regenie_step2: 32000
  mem_mb_remeta_ld: 32000
  time_min_small: 60
  time_min_gwas: 240
  time_min_admixture: 240
  time_min_phase2_pca: 240
  time_min_regenie_step1: 480
  time_min_regenie_step2: 480
  time_min_remeta_ld: 240
