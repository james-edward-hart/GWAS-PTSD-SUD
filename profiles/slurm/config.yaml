executor: slurm
jobs: 100
latency-wait: 60
rerun-incomplete: true
keep-going: true
printshellcmds: true
use-conda: true
restart-times: 1
max-jobs-per-second: 5
max-status-checks-per-second: 5

# Site-specific options; fill these in before production submission.
# Set QOS here only if your cluster requires or recommends one.
# slurm-qos: "normal"
# conda-prefix stores Snakemake-created rule environments; use a writable
# directory accessible to compute nodes, not the conda installation path.
# conda-prefix: "/path/to/shared/conda/envs"

# Default resources apply to every submitted job unless a rule-specific override
# is set below. Replace the account and partition placeholders before production.
default-resources:
  slurm_account: "my_account"
  slurm_partition: "standard"
  mem_mb: 4000
  runtime: 30

set-resources:
  run_plink2_gwas:
    mem_mb: 16000
    runtime: 240
  prepare_phase2_global_pca_markers:
    mem_mb: 16000
    runtime: 240
  prepare_phase2_step1_markers:
    mem_mb: 32000
    runtime: 480
  fit_phase2_global_pca:
    mem_mb: 16000
    runtime: 240
  score_phase2_global_pcs:
    mem_mb: 16000
    runtime: 240
  prepare_phase2_regenie_assoc_genotypes:
    mem_mb: 32000
    runtime: 480
  run_phase2_regenie_step1:
    mem_mb: 32000
    runtime: 480
  run_phase2_regenie_step2:
    mem_mb: 32000
    runtime: 480
  prepare_remeta_target_genotypes:
    mem_mb: 16000
    runtime: 240
  run_remeta_regenie_step2:
    mem_mb: 32000
    runtime: 480
  compute_remeta_marginal_ld:
    mem_mb: 16000
    runtime: 240
  make_unrelated_keep:
    mem_mb: 8000
    runtime: 120
  prepare_relatedness_markers:
    mem_mb: 8000
    runtime: 120
  convert_reference_for_ancestry:
    mem_mb: 16000
    runtime: 240
  convert_study_for_ancestry:
    mem_mb: 16000
    runtime: 240
  ld_prune_ancestry_markers:
    mem_mb: 16000
    runtime: 240
  fit_reference_pca:
    mem_mb: 32000
    runtime: 480
  score_reference_pcs:
    mem_mb: 16000
    runtime: 240
  score_study_pcs:
    mem_mb: 16000
    runtime: 240
  run_within_ancestry_pca:
    mem_mb: 16000
    runtime: 240
  convert_reference_for_admixture:
    mem_mb: 16000
    runtime: 240
  convert_study_for_admixture:
    mem_mb: 16000
    runtime: 240
  ld_prune_admixture_markers:
    mem_mb: 16000
    runtime: 240
  merge_admixture_genotypes:
    mem_mb: 16000
    runtime: 240
  run_supervised_admixture:
    mem_mb: 16000
    runtime: 240
