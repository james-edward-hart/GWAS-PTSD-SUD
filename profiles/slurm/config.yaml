executor: slurm
jobs: 100
latency-wait: 60
rerun-incomplete: true
keep-going: true
printshellcmds: true
use-conda: true
restart-times: 1
max-jobs-per-second: 5
max-status-checks-per-second: 5

# Site-specific options; fill these in before production submission.
# Set QOS here only if your cluster requires or recommends one.
# slurm-qos: "normal"
# conda-prefix stores Snakemake-created rule environments; use a writable
# directory accessible to compute nodes, not the conda installation path.
# conda-prefix: "/path/to/shared/conda/envs"

# Default resources apply to every submitted job unless a rule-specific override
# is set below. Full-result GWAS and reporting jobs retain extra memory until
# their association-table readers are also streaming.
default-resources:
  slurm_account: "my_account"
  slurm_partition: "standard"
  mem_mb: 32000
  runtime: 60

set-resources:
  infer_genome_build:
    mem_mb: 32000
    runtime: 60
  validate_config:
    mem_mb: 32000
    runtime: 60
  run_sex_check:
    mem_mb: 32000
    runtime: 60
  write_control_hwe_variants:
    mem_mb: 32000
    runtime: 240
  run_plink2_gwas:
    mem_mb: 64000
    runtime: 240
  summarize_gwas_run:
    mem_mb: 64000
    runtime: 60
  plot_gwas:
    mem_mb: 64000
    runtime: 60
  make_report:
